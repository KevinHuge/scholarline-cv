[package]
name = "scholarline-cv"
version = "0.1.0"
entrypoint = "lib.typ"
authors = ["Scholarline CV contributors"]
license = "MIT"
description = "A minimal, customizable academic CV template for Typst."
keywords = ["cv", "resume", "academic", "publications", "research", "minimal", "chinese"]
categories = ["cv"]
compiler = "0.13.0"
repository = "https://github.com/KevinHuge/scholarline-cv"
exclude = ["tests", "docs", "assets", ".github"]

[template]
path = "template"
entrypoint = "main.typ"
# Before Typst Universe submission, generate thumbnail.png and uncomment:
# thumbnail = "thumbnail.png"
