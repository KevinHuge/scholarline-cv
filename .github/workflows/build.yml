name: Build and test
on:
  push:
  pull_request:
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: typst-community/setup-typst@v4
        with:
          typst-version: 0.13.1
      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          mkdir -p fonts
          curl -sSL -o /tmp/inter.zip https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip
          unzip -o -j -q /tmp/inter.zip 'extras/ttf/Inter-Regular.ttf' 'extras/ttf/Inter-Medium.ttf' \
            'extras/ttf/Inter-SemiBold.ttf' 'extras/ttf/Inter-Bold.ttf' 'extras/ttf/InterDisplay-Bold.ttf' -d fonts
          typst fonts --font-path fonts | grep -qx "Inter"
          typst fonts --font-path fonts | grep -qx "Inter Display"
          typst fonts --font-path fonts | grep -q "Noto Sans CJK SC"
      - name: Run tests
        run: tests/run.sh --font-path fonts
      - name: Compile examples (fail on missing fonts)
        run: |
          mkdir -p previews
          for f in main.typ examples/*.typ; do
            typst compile --root . --font-path fonts "$f" "previews/$(basename "$f" .typ).pdf" 2>&1 | tee /tmp/typst.log
            if grep -q "unknown font family" /tmp/typst.log; then echo "::error::missing font in $f"; exit 1; fi
          done
      - name: Render plugin gallery
        run: docs/gallery/build.sh previews/gallery
      - name: Upload previews
        uses: actions/upload-artifact@v4
        with:
          name: scholarline-cv-previews
          path: previews/
          if-no-files-found: error
          retention-days: 14
